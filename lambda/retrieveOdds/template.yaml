AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fetch all five leagues every five minutes and publish EV/arbitrage without DynamoDB storage.

Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
  OddsApiBaseUrl:
    Type: String
    Description: HTTPS origin of the in-house odds API (without the /v1 path).
  RedisUrl:
    Type: String
    NoEcho: true
    Default: ''
    Description: TLS Redis URL supplied by the REDIS_URL GitHub secret.
  EnableReservedConcurrency:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Reserve one execution only when the regional Lambda quota allows it.

Conditions:
  ReserveConcurrency: !Equals [!Ref EnableReservedConcurrency, 'true']

Resources:
  RetrieveOddsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: odds_pipeline.handler.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: !If [ReserveConcurrency, 1, !Ref 'AWS::NoValue']
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          ODDS_API_KEY: !Ref OddsApiKey
          ODDS_API_BASE_URL: !Ref OddsApiBaseUrl
          RESULTS_BUCKET: !Ref OddsCacheBucket
          REDIS_URL: !Ref RedisUrl
      Policies:
        - S3WritePolicy:
            BucketName: !Ref OddsCacheBucket
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  OddsCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

Outputs:
  ResultsBucketName:
    Value: !Ref OddsCacheBucket
