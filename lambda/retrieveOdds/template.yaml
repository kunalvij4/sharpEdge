AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fetch all five leagues every five minutes, retain closing prices, and publish EV/arbitrage.

Parameters:
  OddsApiKey:
    Type: String
    NoEcho: true
  OddsApiBaseUrl:
    Type: String
    Description: HTTPS origin of the in-house odds API (without the /v1 path).
  RedisUrl:
    Type: String
    NoEcho: true
    Default: ''
    Description: TLS Redis URL supplied by the REDIS_URL GitHub secret.

Resources:
  RetrieveOddsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: odds_pipeline.handler.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          ODDS_API_KEY: !Ref OddsApiKey
          ODDS_API_BASE_URL: !Ref OddsApiBaseUrl
          CLOSING_ODDS_TABLE: !Ref ClosingOddsTable
          RESULTS_BUCKET: !Ref OddsCacheBucket
          REDIS_URL: !Ref RedisUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClosingOddsTable
        - S3WritePolicy:
            BucketName: !Ref OddsCacheBucket
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  ClosingOddsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-ClosingOdds"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: bet_key
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: bet_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OddsCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

  # Preserve the original table during this migration. The new pipeline does
  # not read or write it; removing it here would delete existing historical data.
  AllOddsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-AllOdds"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: retrieved_at
          AttributeType: S
      KeySchema:
        - AttributeName: game_id
          KeyType: HASH
        - AttributeName: retrieved_at
          KeyType: RANGE

Outputs:
  ClosingOddsTableName:
    Value: !Ref ClosingOddsTable
  ResultsBucketName:
    Value: !Ref OddsCacheBucket
