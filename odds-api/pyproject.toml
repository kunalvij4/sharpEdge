[project]
name = "in-house-odds-api"
version = "0.1.0"
description = "Persisted Unabated odds with a v4-compatible FastAPI interface"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.119.0",
  "uvicorn==0.37.0",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.44",
  "alembic==1.17.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.11.0",
]

[project.optional-dependencies]
bet365-probe = [
    "playwright==1.64.0",
]
[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
