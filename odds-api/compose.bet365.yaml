# Standalone browser worker; does not load the production database/provider env.
name: sharpedge-bet365
services:
  bet365:
    image: in-house-odds-bet365:research
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.bet365
    init: true
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/seccomp-browser.json
    stop_grace_period: 30s
    environment:
      TZ: America/New_York
    volumes:
      - ./artifacts/bet365-docker:/app/artifacts
