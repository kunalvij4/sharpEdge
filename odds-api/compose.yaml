name: in-house-odds
x-database: &database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odds}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-odds}
  LEAGUES_JSON: ${LEAGUES_JSON:?Set LEAGUES_JSON}

services:
  db:
    image: postgres:17.6-bookworm
    shm_size: 256mb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odds}
      POSTGRES_USER: ${POSTGRES_USER:-odds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - odds-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: in-house-odds-api:integrated
    platform: linux/amd64
    build: .
    restart: "no"
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database
    depends_on:
      db:
        condition: service_healthy

  api:
    image: in-house-odds-api:integrated
    platform: linux/amd64
    init: true
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp=./docker/seccomp-browser.json
    stop_grace_period: 45s
    environment:
      <<: *database
      API_KEYS: ${API_KEYS:?Set API_KEYS}
      COLLECTED_TTL: ${COLLECTED_TTL:-90}
      SOURCE_TTL: ${SOURCE_TTL:-3600}
      PROPS_CACHE_TTL: ${PROPS_CACHE_TTL:-3600}
      UNABATED_API_KEY: ${UNABATED_API_KEY:?Set UNABATED_API_KEY}
      UNABATED_API_BASE_URL: ${UNABATED_API_BASE_URL:-https://data.unabated.com}
      UNABATED_PARTNER_CODE: ${UNABATED_PARTNER_CODE:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-1}
      RATE_MIN_INTERVAL: ${RATE_MIN_INTERVAL:-0.1}
      ODDS_MIN_INTERVAL: ${ODDS_MIN_INTERVAL:-5}
      METADATA_TTL: ${METADATA_TTL:-3600}
      SCOPE_METADATA_TTL: ${SCOPE_METADATA_TTL:-300}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-0}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20}
      UNABATED_BET_TYPE_MAP: ${UNABATED_BET_TYPE_MAP:?Set UNABATED_BET_TYPE_MAP}
      UNABATED_PERIOD_MAP: ${UNABATED_PERIOD_MAP:?Set UNABATED_PERIOD_MAP}
      BET365_ENABLED: ${BET365_ENABLED:-true}
      BET365_REGION: ${BET365_REGION:-nj}
      BET365_INTERVAL: ${BET365_INTERVAL:-90}
      BET365_MAX_AGE: ${BET365_MAX_AGE:-150}
      TZ: America/New_York
    volumes:
      - bet365-artifacts:/app/artifacts
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  odds-data:
  bet365-artifacts:
