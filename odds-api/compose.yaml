name: in-house-odds
x-database: &database
  STORAGE_BACKEND: redis
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  REDIS_PREFIX: ${REDIS_PREFIX:-sharpedge:odds:v1}
  LEAGUES_JSON: ${LEAGUES_JSON:?Set LEAGUES_JSON}

services:
  api:
    image: ${ODDS_API_IMAGE:-in-house-odds-api:integrated}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      <<: *database
      API_KEYS: ${API_KEYS:?Set API_KEYS}
      COLLECTED_TTL: ${COLLECTED_TTL:-600}
      SOURCE_TTL: ${SOURCE_TTL:-3600}
      PROPS_CACHE_TTL: ${PROPS_CACHE_TTL:-3600}
      PROPLINE_ENABLED: ${PROPLINE_ENABLED:-true}
      PROPLINE_API_KEY: ${PROPLINE_API_KEY:-}
      PROPLINE_POLL_INTERVAL: "480"
      PROPLINE_REQUEST_TIMEOUT: ${PROPLINE_REQUEST_TIMEOUT:-90}
      PROPLINE_COLLECTED_TTL: ${PROPLINE_COLLECTED_TTL:-600}
      PROPLINE_MAX_AGE: ${PROPLINE_MAX_AGE:-900}
      UNABATED_ENABLED: "true"
      UNABATED_ODDS_ENABLED: "false"
      UNABATED_API_KEY: ${UNABATED_API_KEY:?Set UNABATED_API_KEY}
      UNABATED_API_BASE_URL: ${UNABATED_API_BASE_URL:-https://data.unabated.com}
      UNABATED_PARTNER_CODE: ${UNABATED_PARTNER_CODE:-}
      POLL_INTERVAL: "480"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-1}
      RATE_MIN_INTERVAL: ${RATE_MIN_INTERVAL:-0.1}
      ODDS_MIN_INTERVAL: ${ODDS_MIN_INTERVAL:-5}
      METADATA_TTL: ${METADATA_TTL:-3600}
      SCOPE_METADATA_TTL: ${SCOPE_METADATA_TTL:-300}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-0}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20}
      UNABATED_BET_TYPE_MAP: '{}'
      UNABATED_PERIOD_MAP: '{}'
      BET365_ENABLED: "false"
      TZ: America/New_York
    volumes:
      - collection-artifacts:/app/artifacts
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  collection-artifacts:
