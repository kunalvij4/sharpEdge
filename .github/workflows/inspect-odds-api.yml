name: Inspect odds API collector

on:
  workflow_dispatch:
    inputs:
      verify_seconds:
        description: "Observe live quote preservation for 0 to 600 seconds (0 skips)"
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '45.76.8.244' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'in-house-odds' }}
    steps:
      - name: Inspect collector state without loading the full odds store
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERIFY_SECONDS: ${{ inputs.verify_seconds || '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$VERIFY_SECONDS" =~ ^[0-9]{1,3}$ ]] && (( 10#$VERIFY_SECONDS <= 600 ))
          umask 077
          mkdir -p "$RUNNER_TEMP/odds-inspect"
          trap 'rm -f -- "$RUNNER_TEMP/odds-inspect/key" "$RUNNER_TEMP/odds-inspect/known_hosts" "$RUNNER_TEMP/odds-inspect/askpass"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/odds-inspect/known_hosts"
          ssh_options=(-p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/odds-inspect/known_hosts" -o ConnectTimeout=15)
          if [[ -n "$SSH_PRIVATE_KEY" ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/odds-inspect/key"
            ssh_options+=(-i "$RUNNER_TEMP/odds-inspect/key" -o BatchMode=yes -o IdentitiesOnly=yes)
          else
            [[ -n "$SSH_PASSWORD" ]]
            cat > "$RUNNER_TEMP/odds-inspect/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSWORD"
          ASKPASS
            chmod 700 "$RUNNER_TEMP/odds-inspect/askpass"
            export SSH_ASKPASS="$RUNNER_TEMP/odds-inspect/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=odds-inspect
            ssh_options+=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1)
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          container=$(ssh "${ssh_options[@]}" "$target" "docker ps -a --filter 'label=com.docker.compose.project=$DEPLOY_PROJECT' --filter 'label=com.docker.compose.service=api' --format '{{.ID}}'")
          [[ "$container" =~ ^[0-9a-f]{12,64}$ ]]
          # Capture startup failures even while the runtime is restarting.
          ssh "${ssh_options[@]}" "$target" "docker inspect --format 'image={{.Config.Image}} status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' '$container'"
          ssh "${ssh_options[@]}" "$target" "docker logs --since 20m --tail 80 '$container'"
          cat > "$RUNNER_TEMP/inspect_odds.py" <<'PY'
          import hashlib
          import inspect
          import json
          import zlib
          from collections import Counter
          from dataclasses import asdict
          from datetime import UTC, datetime
          from pathlib import Path
          from odds_api.infrastructure.config import Settings
          from odds_api.infrastructure.redis_repository import RedisRepository
          from odds_api.infrastructure.storage import create_repository

          settings = Settings()
          repository = create_repository(settings)
          result = {"observed_at": datetime.now(UTC).isoformat()}
          result["runtime"] = {
              "redis_repository_sha256": hashlib.sha256(Path(inspect.getfile(RedisRepository)).read_bytes()).hexdigest(),
              "batched_event_writes": "pipe.watch(*keys)" in inspect.getsource(RedisRepository.save),
              "unabated_odds_enabled": settings.unabated_odds_enabled,
          }
          if settings.storage_backend == "redis":
              result["collector"] = json.loads(repository.client.get(repository.key("collector")) or "{}")
              result["failures"] = repository.client.hgetall(repository.key("failures"))
              for section, fields in (("server", ("redis_version",)), ("memory", ("used_memory", "used_memory_human", "used_memory_rss", "used_memory_peak", "mem_fragmentation_ratio", "maxmemory", "maxmemory_human", "maxmemory_policy")), ("stats", ("evicted_keys", "expired_keys", "total_error_replies"))):
                  try:
                      details = repository.client.info(section)
                      result[section] = {field: details.get(field) for field in fields}
                  except Exception as error:
                      result[section] = {"error_type": type(error).__name__}
              try:
                  result["oom_script_flags_supported"] = repository.client.eval("#!lua flags=allow-oom\nreturn 1", 0) == 1
              except Exception as error:
                  result["oom_script_flags_supported"] = {"error_type": type(error).__name__}
              document = repository.client.get(repository.key("event:165ea511badc5c4498ce36684d4ff968"))
              if document:
                  raw = document.encode()
                  result["sample_event_bytes"] = {"current": len(raw), "zlib_level_one": len(zlib.compress(raw, 1))}
          for name, filename in (("schedule", settings.collection_state_path), ("propline", str(Path(settings.propline_output_dir) / "status.json"))):
              try:
                  result[name] = json.loads(Path(filename).read_text())
              except (OSError, ValueError):
                  result[name] = {"state": "unavailable"}
          rows = repository.quotes("nba_basketball", event_id="165ea511badc5c4498ce36684d4ff968")
          result["sample_nba_quotes"] = dict(Counter(row["book_key"].split("_", 1)[0] for row in rows))
          result["sample_nba_collected_at"] = {
              provider: sorted({row["quote"].collected_at.isoformat() for row in rows if row["book_key"].startswith(provider + "_")})
              for provider in ("propline", "unabated")
          }
          result["sample_provider_fingerprints"] = {
              provider: hashlib.sha256(json.dumps(
                  {row["quote"].selection_id: asdict(row["quote"]) for row in rows if row["book_key"].startswith(provider + "_")},
                  sort_keys=True, default=str,
              ).encode()).hexdigest()
              for provider in ("propline", "unabated")
          }
          repository.close()
          print(json.dumps(result, indent=2))
          # Optional read-only observation across a scheduled collection cycle.
          import os
          import time
          import urllib.request
          from datetime import timedelta
          from odds_api.application.prepared_odds import stored_event, stored_rows, time_value
          from odds_api.domain.sportsbooks import sportsbook_key
          from odds_api.infrastructure.redis_repository import decode_document

          seconds = int(os.environ.get("VERIFY_SECONDS", "0"))
          if seconds:
              assert settings.storage_backend == "redis", "Live preservation check requires Redis"
              repository = create_repository(settings)
              previous, checked, updates = {}, 0, 0
              shared_api_checks, filter_checks, observed_providers = 0, 0, set()
              public_keys = set()
              deadline = time.monotonic() + seconds
              headers = {"X-API-Key": settings.api_keys.get_secret_value().split(",")[0].strip()}

              def get(path):
                  request = urllib.request.Request("http://localhost:8000" + path, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)

              while True:
                  now = datetime.now(UTC)
                  selected = {}
                  for league in settings.leagues:
                      ids = repository.client.zrangebyscore(
                          repository.key("events:" + league), (now + timedelta(minutes=20)).timestamp(), "+inf",
                          start=0, num=5,
                      )
                      if not ids:
                          continue
                      values = repository.client.mget([repository.key("event:" + eid) for eid in ids])
                      for eid, value in zip(ids, values):
                          if value:
                              selected[eid] = decode_document(value)
                  # Keep observing already selected fixtures until kickoff, even
                  # if a newer event changes the first-five index window.
                  for eid in previous.keys() - selected.keys():
                      value = repository.client.get(repository.key("event:" + eid))
                      if value:
                          selected[eid] = decode_document(value)
                      elif previous[eid][0] > now:
                          raise AssertionError("Future sample event disappeared")
                  candidates = []
                  for eid, document in selected.items():
                      start = time_value(stored_event(document)["start"])
                      if start <= now:
                          continue
                      rows = dict(stored_rows(document))
                      providers = {r["book_key"].split("_", 1)[0] for r in rows.values()}
                      observed_providers.update(providers)
                      prior = previous.get(eid)
                      if prior:
                          assert not prior[1].keys() - rows.keys(), "Stored selections disappeared"
                          for sid, row in prior[1].items():
                              current = rows[sid]
                              assert current["book_key"] == row["book_key"], "Quote changed provider/book"
                              assert current["quote"]["book_id"] == row["quote"]["book_id"], "Quote book identity changed"
                              if row["book_key"].startswith("unabated_") and current["quote"] != row["quote"]:
                                  updates += 1
                          checked += len(prior[1])
                      previous[eid] = (start, rows)
                      by_key = {}
                      for row in rows.values():
                          key = sportsbook_key(row["book_key"], row["book_title"])
                          by_key.setdefault(key, set()).add(row["book_key"].split("_", 1)[0])
                      if any({"propline", "unabated"} <= sources for sources in by_key.values()):
                          latest = max(time_value(r["quote"]["collected_at"]) for r in rows.values())
                          candidates.append((latest, eid))
                  for _, candidate in sorted(candidates, reverse=True):
                      for suffix in ("odds?markets=h2h,spreads", "props"):
                          payload = get(f"/v1/events/{candidate}/{suffix}")
                          keys = [b["key"] for b in payload["bookmakers"]]
                          public_keys.update(keys)
                          assert len(keys) == len(set(keys)), "Duplicate public sportsbook keys"
                          assert not any(k.startswith(("propline_", "unabated_")) for k in keys)
                          if "draftkings" in keys:
                              filtered = get(f"/v1/events/{candidate}/{suffix}" + ("&" if "?" in suffix else "?") + "bookmakers=draftkings")
                              assert [b["key"] for b in filtered["bookmakers"]] == ["draftkings"]
                              filter_checks += 1
                          shared_api_checks += bool(keys)
                      if filter_checks:
                          break
                  heartbeat = json.loads(repository.client.get(repository.key("collector")) or "{}")
                  stamp = time_value(heartbeat.get("heartbeat"))
                  assert stamp and (now - stamp).total_seconds() < 30, "Collector heartbeat is stale"
                  print(json.dumps({"verification_progress": {
                      "sample_events": len(previous), "retained_selection_checks": checked,
                      "unabated_quote_updates": updates, "shared_book_api_checks": shared_api_checks,
                      "draftkings_filter_checks": filter_checks,
                      "providers": sorted(observed_providers), "public_book_keys": sorted(public_keys),
                  }}), flush=True)
                  if time.monotonic() >= deadline:
                      break
                  time.sleep(min(30, max(0, deadline - time.monotonic())))
              assert {"propline", "unabated"} <= observed_providers, "Both feeds were not observed"
              if seconds >= 480:
                  assert checked and updates, "No Unabated quote updates observed; preservation is inconclusive"
              assert shared_api_checks, "No shared-book API sample observed"
              assert filter_checks, "No DraftKings filter sample observed"
              repository.close()
              label = "live_preservation_verification" if seconds >= 480 else "live_api_verification"
              print(json.dumps({label: "passed"}), flush=True)
          PY
          if ! ssh "${ssh_options[@]}" "$target" "docker exec -e VERIFY_SECONDS='$VERIFY_SECONDS' -i '$container' python -" < "$RUNNER_TEMP/inspect_odds.py"; then
            printf 'Runtime inspection or requested verification failed.\n'
            exit 1
          fi
