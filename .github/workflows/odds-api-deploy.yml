name: Deploy odds API
run-name: Deploy odds API ${{ inputs.image_version }}

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Published version: sha-<full 40-character commit SHA> (or the full SHA)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: odds-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '45.76.8.244' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR }}
      DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'in-house-odds' }}
    steps:
      - name: Validate version and server settings
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        shell: bash
        run: |
          commit=${IMAGE_VERSION#sha-}
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Use a full lowercase commit SHA, optionally prefixed with sha-.' >&2; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid DEPLOY_HOST.' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid DEPLOY_USER.' >&2; exit 1; }
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$DEPLOY_PORT < 1 || 10#$DEPLOY_PORT > 65535 )); then
            echo 'Invalid DEPLOY_PORT.' >&2
            exit 1
          fi
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_DIR" != / && "$DEPLOY_DIR" != */ ]] || { echo 'Set DEPLOY_DIR as a production environment variable or secret containing the absolute existing deployment directory, without a trailing slash.' >&2; exit 1; }
          [[ "/$DEPLOY_DIR/" != */../* && "/$DEPLOY_DIR/" != */./* ]] || { echo 'DEPLOY_DIR cannot contain . or .. path segments.' >&2; exit 1; }
          [[ "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid DEPLOY_PROJECT.' >&2; exit 1; }
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_TAG=ghcr.io/%s-odds-api:sha-%s\n' "${GITHUB_REPOSITORY,,}" "$commit" >> "$GITHUB_ENV"
          printf 'RELEASE_DIR=%s/releases/%s-%s\n' "$DEPLOY_DIR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out the source belonging to the image
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.version.outputs.commit }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify the published image
        env:
          EXPECTED_COMMIT: ${{ steps.version.outputs.commit }}
        shell: bash
        run: |
          test -f odds-api/deploy/deploy.sh
          docker pull --platform linux/amd64 "$IMAGE_TAG"
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")
          [[ "$revision" == "$EXPECTED_COMMIT" ]] || { echo 'Image revision does not match the requested source.' >&2; exit 1; }
          image_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          [[ "$image_ref" =~ ^ghcr.io/[a-z0-9_./-]+@sha256:[0-9a-f]{64}$ ]] || { echo 'Cannot resolve an immutable image digest.' >&2; exit 1; }
          printf 'IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Set the production secret DEPLOY_KNOWN_HOSTS.' >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/odds-ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/odds-ssh/known_hosts"
          if [[ -n "$SSH_PRIVATE_KEY" ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/odds-ssh/key"
          elif [[ -n "$SSH_PASSWORD" ]]; then
            cat > "$RUNNER_TEMP/odds-ssh/askpass" <<'SCRIPT'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSWORD"
          SCRIPT
            chmod 700 "$RUNNER_TEMP/odds-ssh/askpass"
          else
            echo 'Set production secret DEPLOY_SSH_PASSWORD or DEPLOY_SSH_KEY.' >&2
            exit 1
          fi
      - name: Transfer release configuration and deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_REDIS_URL: ${{ secrets.ODDS_REDIS_URL }}
          REGISTRY_USER: ${{ github.actor }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        shell: bash
        run: |
          ssh_options=(
            -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/odds-ssh/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          )
          if [[ -f "$RUNNER_TEMP/odds-ssh/key" ]]; then
            ssh_options+=(-i "$RUNNER_TEMP/odds-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes)
          else
            export SSH_ASKPASS="$RUNNER_TEMP/odds-ssh/askpass"
            export SSH_ASKPASS_REQUIRE=force DISPLAY=odds-deploy
            ssh_options+=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1)
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # Validated paths must expand locally to form the remote command.
          # shellcheck disable=SC2029
          tar -C odds-api -czf - compose.yaml deploy/deploy.sh |
            ssh "${ssh_options[@]}" "$target" "set -eu; umask 077; mkdir -p '$RELEASE_DIR'; tar -xzf - -C '$RELEASE_DIR'"
          # shellcheck disable=SC2029
          [[ "$ODDS_REDIS_URL" != *$'\n'* && "$ODDS_REDIS_URL" != *$'\r'* ]] || { echo "ODDS_REDIS_URL must be a single-line URL." >&2; exit 1; }
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$ODDS_REDIS_URL" |
            ssh "${ssh_options[@]}" "$target" "bash '$RELEASE_DIR/deploy/deploy.sh' '$DEPLOY_DIR' '$IMAGE_REF' '$REGISTRY_USER' '$DEPLOY_PROJECT'"
          {
            printf '### Odds API deployed\n\n'
            printf 'Server: %s\n\n' "$DEPLOY_HOST"
            printf 'Image: %s\n\n' "$IMAGE_REF"
            printf 'Release: %s\n\n' "$RELEASE_DIR"
            printf 'The API passed its /health/ready health check.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/odds-ssh/key" "$RUNNER_TEMP/odds-ssh/known_hosts" "$RUNNER_TEMP/odds-ssh/askpass"
